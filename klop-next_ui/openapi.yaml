openapi: 3.1.1
info:
  title: KLOP Platform API
  version: 1.0.0
servers:
  - url: http://localhost:5041/
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Check process liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /.well-known/jwks.json:
    get:
      tags:
        - Authentication
      summary: Get public signing keys
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /api/v1/master/organization-types:
    get:
      tags:
        - Master Data
      summary: List organization types
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfIReadOnlyListOfOrganizationType'
  /api/v1/master/tenant-types:
    get:
      tags:
        - Master Data
      summary: List active tenant types
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfIReadOnlyListOfTenantTypeReference'
  /api/v1/public/legal/terms/current:
    get:
      tags:
        - Public Legal Documents
      summary: Get current published Terms and Conditions for registration
      parameters:
        - name: registrationType
          in: query
          required: true
          schema:
            type: string
            enum:
              - PERSONAL
              - ORGANIZATION
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalTermsMetadata'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/public/legal/terms/{documentVersionId}/file:
    get:
      tags:
        - Public Legal Documents
      summary: Get a published Terms and Conditions PDF
      parameters:
        - name: documentVersionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/platform/legal-documents/permissions:
    get:
      tags:
        - Platform Legal Documents
      summary: Get the authenticated user's effective legal document permissions
      responses:
        '200':
          description: Effective PLATFORM-scoped capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfPlatformLegalDocumentPermissions'
        '401':
          description: Unauthorized
        '503':
          description: Permission service unavailable
      security:
        - Bearer: []
  /api/v1/platform/legal-documents:
    get:
      tags:
        - Platform Legal Documents
      summary: List legal documents and versions
      responses:
        '200':
          description: Legal documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocumentList'
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM legal-document read capability
      security:
        - Bearer: []
    post:
      tags:
        - Platform Legal Documents
      summary: Upload a PDF as a new legal document draft version
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LegalDocumentDraftUpload'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocument'
        '400':
          description: Invalid metadata or PDF
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM draft-create capability
        '503':
          description: Private document storage unavailable
      security:
        - Bearer: []
  /api/v1/platform/legal-documents/{legalDocumentId}:
    get:
      tags:
        - Platform Legal Documents
      summary: Get a legal document and its version history
      parameters:
        - name: legalDocumentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Legal document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocument'
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM legal-document read capability
        '404':
          description: Legal document not found
      security:
        - Bearer: []
  /api/v1/platform/legal-documents/versions/{documentVersionId}:
    put:
      tags:
        - Platform Legal Documents
      summary: Update DRAFT metadata and registration scopes
      parameters:
        - $ref: '#/components/parameters/DocumentVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalDocumentDraftUpdate'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocument'
        '400':
          description: Invalid draft metadata or row version
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM draft-edit capability
        '404':
          description: Legal document version not found
        '409':
          description: Version changed or is not DRAFT
      security:
        - Bearer: []
  /api/v1/platform/legal-documents/versions/{documentVersionId}/preview:
    get:
      tags:
        - Platform Legal Documents
      summary: Preview a private DRAFT, PENDING_APPROVAL, or APPROVED PDF
      parameters:
        - $ref: '#/components/parameters/DocumentVersionId'
      responses:
        '200':
          description: Private PDF preview
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM draft-preview capability
        '404':
          description: Preview unavailable
        '503':
          description: Storage integrity validation failed
      security:
        - Bearer: []
  /api/v1/platform/legal-documents/versions/{documentVersionId}/submit-for-approval:
    post:
      tags:
        - Platform Legal Documents
      summary: Submit a validated DRAFT for approval
      parameters:
        - $ref: '#/components/parameters/DocumentVersionId'
      responses:
        '200':
          description: Submitted version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocument'
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM submit capability
        '404':
          description: Legal document version not found
        '409':
          description: Version is not DRAFT or file integrity check failed
      security:
        - Bearer: []
  /api/v1/platform/legal-documents/versions/{documentVersionId}/approve:
    post:
      tags:
        - Platform Legal Documents
      summary: Approve or reject a submitted version
      parameters:
        - $ref: '#/components/parameters/DocumentVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalDocumentApprovalRequest'
      responses:
        '200':
          description: Approval decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocument'
        '400':
          description: Invalid decision
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM approval capability
        '404':
          description: Legal document version not found
        '409':
          description: Version is not pending approval
      security:
        - Bearer: []
  /api/v1/platform/legal-documents/versions/{documentVersionId}/publish:
    post:
      tags:
        - Platform Legal Documents
      summary: Publish an approved version
      parameters:
        - $ref: '#/components/parameters/DocumentVersionId'
      responses:
        '200':
          description: Published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocument'
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM publish capability
        '404':
          description: Legal document version not found
        '409':
          description: Version is not approved or file integrity check failed
      security:
        - Bearer: []
  /api/v1/platform/legal-documents/versions/{documentVersionId}/archive:
    post:
      tags:
        - Platform Legal Documents
      summary: Archive a superseded published version
      parameters:
        - $ref: '#/components/parameters/DocumentVersionId'
      responses:
        '200':
          description: Archived version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLegalDocument'
        '401':
          description: Unauthorized
        '403':
          description: Missing PLATFORM archive capability
        '404':
          description: Legal document version not found
        '409':
          description: Version is current or is not published
      security:
        - Bearer: []
  /api/v1/platform/registrations/summary:
    get:
      tags:
        - Platform Registrations
      summary: Get registration summary counts by registration type
      parameters:
        - name: registrationType
          in: query
          required: true
          schema:
            type: string
            enum:
              - PERSONAL
              - ORGANIZATION
      responses:
        '200':
          description: Registration counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfPlatformRegistrationSummary'
        '400':
          description: Invalid registration type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Registration service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: []
  /api/v1/platform/registrations/permissions:
    get:
      tags:
        - Platform Registrations
      summary: Get the authenticated user's effective registration permissions
      description: Returns only the current session's database-resolved registration capabilities. This endpoint does not grant registration access.
      responses:
        '200':
          description: Effective registration permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfPlatformRegistrationPermissions'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Permission service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: []
  /api/v1/platform/role-permissions/access:
    get:
      tags:
        - Platform Role & Permission Matrix
      summary: Get the caller's effective matrix access capabilities
      responses:
        '200':
          description: Effective matrix read and update capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfRolePermissionMatrixAccessResponse'
        '401':
          description: Unauthorized
        '503':
          description: Permission service unavailable
      security:
        - Bearer: []
  /api/v1/platform/role-permissions/matrix:
    get:
      tags:
        - Platform Role & Permission Matrix
      summary: Load the database-backed unified role and permission matrix
      description: Requires platform.role_permissions.read. Configured grants are distinct from resource-level authorization.
      responses:
        '200':
          description: Unified permissions, role columns, tenant contexts, and policy cells
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfRolePermissionMatrixResponse'
        '401':
          description: Unauthorized
        '403':
          description: Missing platform matrix read permission
        '503':
          description: Permission service unavailable
      security:
        - Bearer: []
  /api/v1/platform/role-permissions/history:
    get:
      tags:
        - Platform Role & Permission Matrix
      summary: View permission grant change history
      parameters:
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Audited successful and rejected batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfRolePermissionMatrixHistory'
        '400':
          description: Invalid page request
        '401':
          description: Unauthorized
        '403':
          description: Missing platform matrix read permission
      security:
        - Bearer: []
  /api/v1/platform/role-permissions/changes/validate:
    post:
      tags:
        - Platform Role & Permission Matrix
      summary: Validate a proposed role permission batch without applying it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionMatrixBatchRequest'
      responses:
        '200':
          description: Validation result for the complete batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfRolePermissionMatrixValidationResponse'
        '400':
          description: Invalid request body or change reason
        '401':
          description: Unauthorized
        '403':
          description: Missing platform matrix update permission
        '409':
          description: One or more proposed changes violate current policy
      security:
        - Bearer: []
  /api/v1/platform/role-permissions/changes:
    post:
      tags:
        - Platform Role & Permission Matrix
      summary: Atomically save a validated role permission batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionMatrixBatchRequest'
      responses:
        '200':
          description: Batch saved and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfRolePermissionMatrixSaveResponse'
        '400':
          description: Invalid request body or change reason
        '401':
          description: Unauthorized
        '403':
          description: Missing platform matrix update permission
        '409':
          description: Policy validation failed or the matrix version is stale
      security:
        - Bearer: []
  /api/v1/platform/registrations:
    get:
      tags:
        - Platform Registrations
      summary: Search and page registration applications
      parameters:
        - name: registrationType
          in: query
          required: true
          schema:
            type: string
            enum:
              - PERSONAL
              - ORGANIZATION
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: emailVerificationStatus
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - VERIFIED
        - name: applicationStatus
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Registration application page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfPlatformRegistrationPage'
        '400':
          description: Invalid filter or page parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Registration service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: []
  /api/v1/platform/registrations/{registrationApplicationId}:
    get:
      tags:
        - Platform Registrations
      summary: Get registration application details
      parameters:
        - name: registrationApplicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Registration application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfPlatformRegistrationDetail'
        '400':
          description: Invalid registration application identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Registration application not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Registration service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: []
  /api/v1/platform/registrations/{registrationApplicationId}/timeline:
    get:
      tags:
        - Platform Registrations
      summary: Get persisted registration and verification timeline events
      parameters:
        - name: registrationApplicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Persisted timeline events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfPlatformRegistrationTimeline'
        '400':
          description: Invalid registration application identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Registration application not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Registration service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: []
  /api/v1/auth/registration-policy:
    get:
      tags:
        - Authentication
      summary: Get effective public registration requirements
      responses:
        '200':
          description: Effective registration requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfRegistrationPolicyResponse'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a local user
      description: If accepted, email verification instructions are sent without disclosing account existence.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfMessageResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Registration is disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Terms version is outdated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Registration service is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend email verification instructions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfMessageResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify an email address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfVerifiedResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Returns an access token and sets the refresh cookie for an eligible account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfAccessResult'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh an access token
      description: Requires the refresh cookie and the configured Origin header; does not require a bearer token.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfAccessResult'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out the current session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfLoggedOutResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: []
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOfProfile'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: []
  /api/v1/tenants/mine:
    get:
      tags:
        - Tenants
      summary: List the current user's tenants
      responses:
        '200':
          description: OK
